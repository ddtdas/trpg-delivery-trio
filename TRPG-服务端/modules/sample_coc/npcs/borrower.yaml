# NPC:神秘借阅人维克多·阿什(真相关键/真凶)
# schema: NpcCard v1
id: npc_borrower
name: "维克多·阿什"
role: "外地藏书家(真凶)"
description: "三十多岁,举止优雅,鞋底沾着馆外特有的红泥。伪装成学者,实为受雇窃取密信的中间人;密室蜡烛与账本缺页都是他的手笔。"
lines:
  - "阿卡姆的雾真美,适合读书,不是吗?"
  - "密信?哦,我对那种乡野传说不感兴趣,我只看植物志。"
  - "(被指认时)……看来这家图书馆的待客之道,也不过如此。(吹熄蜡烛)"
traits: {trust: 10, fear: 20, irritate: 70}
secret: "真凶。利用拓印的钥匙开柜,藏信于密室暗格,计划闭馆后从通风管道取走;红泥鞋印与借书单残片是其破绽。"
stance: "全程伪装配合;证据不足时绝不承认;被三条以上线索指认则转入 n8_showdown 对峙。"
hooks: ["n6_npc_talk:主动攀谈试探", "n8_showdown:对峙与逃跑"]
visibility: kp_only
