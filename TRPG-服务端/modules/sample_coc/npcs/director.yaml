# NPC:馆长霍华德·克兰(嫌疑人/委托人)
# schema: NpcCard v1
id: npc_director
name: "霍华德·克兰"
role: "图书馆馆长(委托人,表面嫌疑)"
description: "五十岁,花白胡子,指尖有墨渍。主动报案并支付酬金,但极力催促'今晚就结案',反对报警。"
lines:
  - "这事绝不能传出去……董事会明天就来视察,你们懂的。"
  - "锁?只有我和瑟琳娜有钥匙,我发誓昨晚锁得好好的!"
  - "那个借阅人……维克多?他只是个普通的藏书家,你们别为难客人。"
traits: {trust: 20, fear: 60, irritate: 40}
secret: "欠下大笔赌债,曾想把密信拓本卖给藏书商,但在下手前密信就丢了;他并非窃贼,只是害怕丑事败露。"
stance: "催促结案,隐瞒债务;若被追问赌债会慌乱否认, psychology 成功则动摇。"
hooks: ["n1_front_desk:发布委托", "n6_npc_talk:被追问债务"]
visibility: kp_only
