# NPC:药店老板皮尔斯(邪教外围/圣酒分销)
# schema: NpcCard v1 + ai_lines(可选建议台词,AI 副KP 给 KP 三选一;最终由 KP 拍板)
id: npc_pharmacist
name: "以西结·皮尔斯"
role: "黑水溪药店老板(邪教外围,圣酒分销)"
description: "四十多岁,白大褂干净得不像在乡下开诊所,说话温和圆滑。他是邪教外围的核心联络人:负责把矿场水井酿的'圣酒'(蛇油私酿)经教堂地下室分装,再售给镇上人家。教堂地下室的酒桶和教区名册都与他有关。"
lines:
  - "哦,大学来的学者!黑水溪好久没这么热闹了。教授的事我也很遗憾,那天雨实在太大……"
  - "药酒?那是我们这儿的土方子,祛风湿的。您要的话,瓶子上有我的名帖。"
  - "(被揭穿后)你们不明白……我们只是不想让河水再涨。他们,他们懂怎么让水退下去。"
traits: {trust: 30, fear: 60, irritate: 40}
secret: "邪教外围信徒,负责圣酒分销与药物掩护;他比警长知道得更多——知道教堂地下室名册(c6_church_ledger)与沼泽祭坛的位置;恐惧祭司胜过恐惧法律。"
stance: "圆滑回避,滴水不漏;被逼问/心理学成功后会供出教堂地下室线索以自保,但绝不出卖祭司本人。"
hooks: ["nA1_town:主动搭话试探", "nB1_church:地下室酒桶与名册", "nB2b_bootlegger_hut:运货路线图上的中间站"]
visibility: kp_only
ai_lines:
  - "建议台词1(KP 可选用):'黑水溪的水位啊,是有脾气的。你们城里人不懂——跟河水打交道,得顺着它,得,献点什么。'"
  - "建议台词2(KP 可选用):'教堂?韦斯特牧师只管祷告。地窖那些桶是酒商寄放的,我一个开药铺的,哪管得着人家卖什么。'"
  - "建议台词3(KP 可选用,被逼问后):'沼泽……对,沼泽深处有石台子,那是老辈人祭河的。可这几年,祭的不是河了。你们,你们最好别在满月夜里去。'"
