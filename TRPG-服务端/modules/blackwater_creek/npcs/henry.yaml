# NPC:亨利·格雷(玛莎的侄儿/失踪者/祭品候选)
# schema: NpcCard v1 + ai_lines(可选建议台词,AI 副KP 给 KP 三选一;最终由 KP 拍板)
id: npc_henry
name: "亨利·格雷"
role: "矿工学徒(失踪者,祭品候选)"
description: "二十岁出头的年轻人,矿工学徒,失踪一周。失踪前夜曾对玛莎说'矿场的水井里有人说话'。被邪教抓走关在矿场第三层巷道的水牢里,作为满月仪式的祭品之一。获救时瘦了一圈,眼神发直,嘴里反复念叨同一句话。"
lines:
  - "水井……水井里有人说话。他们说满月,说'蛇母要醒了'。"
  - "矿场的开闸杆!我亲眼看见他们扳了那个杆子——洪水不是天灾,是他们放的!"
  - "教堂底下也有桶……皮尔斯叔叔往酒里掺东西,我、我喝过一口,那之后我看见了蛇。"
traits: {trust: 80, fear: 70, irritate: 5}
secret: "被囚期间偷看到邪教在矿场操作泄洪闸,亲耳听到祭司提到'开闸放水,淹没整条河谷做祭场';这是 c12_henry_whereabouts 与洪水真相的关键人证。"
stance: "获救后极度惊恐,断断续续提供证言;需要安抚(charm/persuade)才能完整复述;他是 e3 全员生还结局的关键人质。"
hooks: ["nC3_ritual_hall:被囚祭品,获救后提供证言", "nC1_mine_gate:地窖地道通往水牢的线索"]
visibility: kp_only
ai_lines:
  - "建议台词1(KP 可选用):'你们别过来……不,不是你们,是水,水从矿道里倒灌上来,我听见他们把闸打开了……'"
  - "建议台词2(KP 可选用):'蛇。满月那晚,皮尔斯叔叔往每个人的酒里倒了一瓶东西,然后大家都开始唱……唱那种沙沙的歌。'"
  - "建议台词3(KP 可选用,获救且安抚成功后):'第三层巷道尽头有个铁笼子,皮克曼先生……教授他还活着,他们就把他关在那儿,等满月。'"
