# NPC:玛莎·格雷(农场主寡妇/求助者/知情者)
# schema: NpcCard v1 + ai_lines(可选建议台词,AI 副KP 给 KP 三选一;最终由 KP 拍板)
id: npc_martha
name: "玛莎·格雷"
role: "格雷农场主寡妇(求助者,表面受害人)"
description: "五十岁出头,粗布裙,围裙口袋里揣着干瘪的烟草袋。丈夫六年前死于黑水矿难,她独自撑起农场。暴雨冲垮了玉米地,她却是全镇第一个站出来求援的人——因为她知道,失踪名单上最后一个名字是她侄儿亨利。"
lines:
  - "洪水毁了我的地,我不在乎。可亨利……亨利只剩三天口粮了,求求你们去矿场看看。"
  - "警长说皮克曼先生是被水冲走的。我见过那条河,它冲不走一个人——它连我的谷仓门都冲不垮。"
  - "我家的地窖,呃……很久以前借给镇上的'酒贩子'放过东西。你们别问,问了我也说不清。"
traits: {trust: 60, fear: 40, irritate: 10}
secret: "年轻时曾把农场地窖借给邪教外围存放'圣酒'(蛇油私酿),丈夫死于矿难后她一直想赎罪;她知道矿场有一条从自家地窖通向第三层巷道的地道,这是救亨利的捷径,也是她最不愿启齿的事。"
stance: "真诚恳求调查员,但隐瞒地窖旧事;被揭穿或心理疏导成功后全盘托出并主动带路。"
hooks: ["n1_arrival:发布委托", "nC1_mine_gate:地窖地道线索", "nC3_ritual_hall:亨利获救后的泪崩"]
visibility: kp_only
ai_lines:
  - "建议台词1(KP 可选用):'亨利那孩子从小在矿上长大,他认得每一条巷道……他要是真出了事,我这条命也没什么好活的了。'"
  - "建议台词2(KP 可选用):'别信警长那套'洪水冲走'的说法。水只往低处走,可人,是往黑处走。'"
  - "建议台词3(KP 可选用,若 PL 追问地窖):'我、我年轻时糊涂……把地窖借给皮尔斯他们存过酒。要是那酒跟亨利的失踪有关,我这辈子都赎不清。'"
