# NPC:皮克曼教授(失踪者/真相钥匙)
# schema: NpcCard v1 + ai_lines(可选建议台词,AI 副KP 给 KP 三选一;最终由 KP 拍板)
id: npc_pickman
name: "艾略特·皮克曼"
role: "密斯卡托尼克大学历史学教授(失踪者)"
description: "四十五岁,瘦高,金丝眼镜断了一条腿。三个月前受考古学会委托来黑水溪研究蛇神崇拜传说,失踪两周,官方说法是'被洪水冲走'。实际上他在追踪邪教时被俘,囚在矿场仪式大厅侧室铁笼里,将成为满月仪式的'蛇母祭品'。"
lines:
  - "洪水是假的……不是,洪水是真的,但冲走我是假的。我看见了泄洪闸的撬痕,他们想淹掉整个河谷。"
  - "蛇神不是传说,是……还在呼吸的东西。沼泽的祭坛,矿场的巷道,它们都是同一具身体的骨头。"
  - "别信警长,别信皮尔斯。信玛莎——她至少还知道自己怕什么。"
traits: {trust: 90, fear: 80, irritate: 20}
secret: "还活着,是唯一完整掌握邪教内情的人:他知道祭司身份、泄洪闸位置、仪式时间;他的研究笔记(c2_pickman_notes)是 A 线钥匙,获救后他本人就是活地图。"
stance: "获救后精神受创但竭力保持学者清醒,提供关键情报;若营救太晚(仪式已开始)则沦为祭品,影响结局结算。"
hooks: ["nA2_archive:研究笔记线索", "nC3_ritual_hall:被囚铁笼,营救/牺牲的结算点"]
visibility: kp_only
ai_lines:
  - "建议台词1(KP 可选用):'孩子,我研究传说三十年……蛇神没有神殿,蛇神就是这条河谷。洪水,矿道,沼泽,全是它的食道。'"
  - "建议台词2(KP 可选用):'他们给我喝那个'圣酒'。我没醉——我看见了祭司的脸。是塞拉斯·韦恩,二十年前给考古队带过路的那个向导。'"
  - "建议台词3(KP 可选用,若祭品结算):'别管我。闸,先关闸。水比蛇更先到。'"
