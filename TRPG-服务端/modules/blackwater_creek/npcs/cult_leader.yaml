# NPC:蛇母祭司(终局首领)
# schema: NpcCard v1 + ai_lines(可选建议台词,AI 副KP 给 KP 三选一;最终由 KP 拍板)
id: npc_cult_leader
name: "塞拉斯·韦恩"
role: "蛇神信徒首领(蛇母祭司,终局对手)"
description: "六十岁上下,黑袍,脖颈与手背布满鳞片状旧疤,说话声像砂纸擦过石头。二十年前他曾是给皮克曼教授那支考古队带路的当地向导,在沼泽见过'蛇母'后皈依,如今自封祭司。他亲自策划了泄洪:开闸放水淹没河谷,把整条黑水溪变成蛇母的祭场。"
lines:
  - "二十年前,我也像你们一样带着火把和枪进沼泽。然后我看见了……蛇母一直在等这条河谷重新沉回水里。"
  - "洪水不是灾祸,是洗礼。水位上涨一寸,蛇母就醒一分。你们来得正好,满月夜的祭品,又多三个。"
  - "(终局)加入我们,或者成为祭品。蛇母不挑,水下的枯骨和台上的活人,对祂来说都是同一种供品。"
traits: {trust: 0, fear: 10, irritate: 90}
secret: "终局首领:操纵泄洪闸、指挥信徒、主持满月仪式;目标是复活'蛇母'(沼泽蛇神)。皮克曼教授与亨利·格雷都被定为祭品。他掌握开闸杆的位置——阻止仪式或牺牲逃亡两条路都绕不开他。"
stance: "冷静狂热,不惧死亡(视死亡为献祭);先劝降,后动手;战斗失败或祭坛被炸毁时试图亲手拉开泄洪闸与全场同归于尽。"
hooks: ["nC3_ritual_hall:终局对峙与三选一结算", "nC2_mine_shaft:仪式念诵声的来源"]
visibility: kp_only
ai_lines:
  - "建议台词1(KP 可选用):'你们在镇上喝的每一口'圣酒'里,都有蛇母的涎水。从你们进镇那一刻起,祂就已经认得你们的气味了。'"
  - "建议台词2(KP 可选用):'闸杆就在我身后。拉下去,河水会填满这条矿道,也填满你们的肺。今晚要么你们带祭品走,要么祭品带你们走。'"
  - "建议台词3(KP 可选用,战败或祭坛被毁时):'太迟了——水已经听话了!蛇母,接住你的河谷!(扑向泄洪闸)'"
