# NPC:警长(腐败/掩盖私酿/表面热情)
# schema: NpcCard v1 + ai_lines(可选建议台词,AI 副KP 给 KP 三选一;最终由 KP 拍板)
id: npc_sheriff
name: "霍勒斯·迪恩"
role: "黑水溪警长(掩盖者,非邪教核心)"
description: "五十岁,络腮胡,皮靴永远沾着泥。表面是热心本地人,发电报给大学通知'洪水冲走皮克曼教授'的就是他。实际上他与私酿利益链分账,收了邪教外围的钱替他们遮掩失踪案——但七个人接连失踪后,他自己也开始害怕。"
lines:
  - "皮克曼教授?可惜了,多体面的学者。那晚水涨得比马背还高,什么都冲走了,什么都找不回来。"
  - "失踪?哪有什么失踪,穷山沟的人搬走很正常,去城里讨生活嘛。"
  - "(被逼问后)……行,行,我说!那封信在我抽屉里放了俩礼拜,我不敢交出去,矿场那些人,他们,他们不是人!他们往我枕头底下塞蛇蜕!蛇蜕!懂吗!"
traits: {trust: 20, fear: 70, irritate: 50}
secret: "私酿分赃人,扣下了皮克曼失踪前寄存在警局的信(c5_sheriff_letter);不是邪教信徒,但对邪教的恐惧让他不敢说出矿场的真相;他需要被逼问或承诺保护才会倒戈。"
stance: "表面热心、实际拖延,用'洪水'说辞打发调查员;被揭穿分赃后因恐惧倒向调查员,提供矿场排班与入口情报。"
hooks: ["n1_arrival:官方接待与洪水说辞", "nA1_town:失踪登记簿", "nA4b_flood_retreat:交出扣押的信"]
visibility: kp_only
ai_lines:
  - "建议台词1(KP 可选用):'听我一句劝,明天天一亮就走。黑水溪的水,晚上会自己涨,自己退,跟……跟呼吸一样。'"
  - "建议台词2(KP 可选用):'你们是大学派来的,我就直说了。那教授不是被水冲走的——他那双靴子,我最后见着是在矿场栅栏边上。但我不能说,说了我这身皮就保不住了。'"
  - "建议台词3(KP 可选用,倒戈后):'矿场排班表从六周前就断了。最后一个下井的是班头塞德里克,他出来的时候嘴里喊着'蛇',当晚就'搬走了'。'"
