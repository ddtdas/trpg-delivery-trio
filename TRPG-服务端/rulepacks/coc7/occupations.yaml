# CoC 7e occupation table (MIT data file) - additive side file.
#
# The delivery-package rulepack (rulepacks/coc7/rulepack.yaml) does NOT
# declare occupations; T1 added this file as rulepack-parallel data (never
# touched by the validate_rulepack path, so coc6/dnd5e/custom are unaffected).
#
# 【队长裁决 2026-09-28】职业信用区间以官方 7e 调查员手册 (Investigator Handbook)
# 职业表为准。每职业标注来源 (7e IH 职业表)；查不到权威值的标注"需人工复核"
# 并给保守默认区间。
# 点数 (7e 官方动态规则, 实算在 coc7_rules.occupation_points)：
#   EDU<=75 -> EDU*4；EDU>75 -> EDU*2+2。points 字段仅为展示参考。
# Semantics:
#   points: "edu_x4" | "edu_x2_p2" (展示参考；实算按 7e 动态规则)
#   credit: {min, max} -> credit_rating range for this occupation
#   source: 来源标注 (7e IH 职业表)
schema: "coc.occupations.v1"
occupations:
  - id: archaeologist
    name: 考古学家
    points: edu_x4
    credit: {min: 10, max: 40}
    source: "7e Investigator Handbook occupation table"
    skills: [anthropology, archaeology, history, language_own, library_use, spot_hidden, science]
